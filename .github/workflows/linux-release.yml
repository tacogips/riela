name: Linux arm64 public 0.2.22 supplement

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to build and upload, for example v0.1.10"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: linux-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-linux-arm64:
    name: Build and upload Linux arm64 CLI archive
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: 29e5ae3e9845a8889fdd5e10f585268259fec772

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+[.][0-9]+[.][0-9]+([-+][0-9A-Za-z][0-9A-Za-z.+-]*)?$'; then
            echo "release tag must look like v<major>.<minor>.<patch>" >&2
            exit 1
          fi
          test "$RELEASE_TAG" = v0.2.22
          test "$(git rev-parse HEAD)" = 29e5ae3e9845a8889fdd5e10f585268259fec772
          ! grep -qi notion-gateway Package.swift Package.resolved
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+[.][0-9]+[.][0-9]+([-+][0-9A-Za-z][0-9A-Za-z.+-]*)?$'; then
            echo "VERSION must be semver-like" >&2
            exit 1
          fi
          if [ "${RELEASE_TAG#v}" != "$VERSION" ]; then
            echo "VERSION ($VERSION) does not match release tag ($RELEASE_TAG)" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build Linux arm64 CLI archive
        env:
          SWIFT_IMAGE: swift:6.3.3-noble@sha256:c2f3ac2eb806ce43f68859c3d52bd3bb1cfc88672fb3a948b76e136d98e39278
          BUN_VERSION: 1.4.3
          BUN_SHA256: efa9813da5ed72423bf847f916e8d2c47c0d776add972354026a75e10da9aa21
        run: |
          set -euo pipefail
          docker run --rm \
            --platform linux/arm64 \
            -e BUN_VERSION \
            -e BUN_SHA256 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$SWIFT_IMAGE" \
            bash -lc '
              set -euo pipefail
              test "$(uname -m)" = "aarch64"
              swift --version
              apt-get update >/dev/null
              apt-get install -y libsqlite3-dev curl unzip >/dev/null
              mkdir -p tmp/linux-release-bun
              curl --fail --location --retry 3 \
                "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-aarch64.zip" \
                -o tmp/linux-release-bun/bun.zip
              printf "%s  %s\n" "$BUN_SHA256" tmp/linux-release-bun/bun.zip | sha256sum -c -
              unzip -q tmp/linux-release-bun/bun.zip -d tmp/linux-release-bun
              install -m 0755 tmp/linux-release-bun/bun-linux-aarch64/bun /usr/local/bin/bun
              bun --version
              scripts/build-homebrew-release.sh linux-arm64
            '

      - name: Verify Linux arm64 CLI archive
        run: |
          set -euo pipefail
          archive="dist/homebrew/riela-$RELEASE_VERSION-linux-arm64.tar.gz"
          checksum="$archive.sha256"
          test -f "$archive"
          test -f "$checksum"
          (cd dist/homebrew && sha256sum -c "riela-$RELEASE_VERSION-linux-arm64.tar.gz.sha256")
          tar -tzf "$archive" | grep -Fx './bin/riela'
          "dist/homebrew/work/riela-$RELEASE_VERSION-linux-arm64/bin/riela" --version | grep -Fx "$RELEASE_VERSION"

      - name: Smoke test archive on clean Ubuntu
        env:
          UBUNTU_IMAGE: ubuntu@sha256:353675e2a41babd526e2b837d7ec780c2a05bca0164f7ea5dbbd433d21d166fc
        run: |
          set -euo pipefail
          docker run --rm \
            --platform linux/arm64 \
            -e RELEASE_VERSION="$RELEASE_VERSION" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$UBUNTU_IMAGE" \
            bash -lc '
              set -euo pipefail
              apt-get update >/dev/null
              apt-get install -y ca-certificates libcurl4 libsqlite3-0 libxml2 >/dev/null
              mkdir -p /tmp/riela-install
              tar -xzf "dist/homebrew/riela-$RELEASE_VERSION-linux-arm64.tar.gz" -C /tmp/riela-install
              install -m 0755 /tmp/riela-install/bin/riela /usr/local/bin/riela
              riela --version | grep -Fx "$RELEASE_VERSION"
            '

      - name: Upload Linux arm64 release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Add only the two missing ARM assets; never create releases or replace assets.
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          existing="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for name in "riela-$RELEASE_VERSION-linux-arm64.tar.gz" "riela-$RELEASE_VERSION-linux-arm64.tar.gz.sha256"; do
            if printf '%s\n' "$existing" | grep -Fx "$name"; then
              echo "asset already exists; refusing replacement" >&2
              exit 1
            fi
          done
          gh release upload "$RELEASE_TAG" \
            "dist/homebrew/riela-$RELEASE_VERSION-linux-arm64.tar.gz" \
            "dist/homebrew/riela-$RELEASE_VERSION-linux-arm64.tar.gz.sha256" \
            --repo "$GITHUB_REPOSITORY"
